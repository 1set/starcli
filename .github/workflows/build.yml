name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions: read-all

jobs:
  compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Verify the pinned interpreter
        run: test "$(go list -m -f '{{.Version}}' go.starlark.net)" = "v0.0.0-20260324133313-ffb3f39dd27a"
      - name: Guard the compatible crypto dependency boundary
        # v0.55.0 keeps Go 1.25 support. Its SSH/OpenPGP packages must not enter
        # this application's build or tests; their advisories need a separate
        # dependency and compatibility review before either package is used.
        run: |
          go list -deps -test ./... > "$RUNNER_TEMP/crypto-imports.txt"
          if grep -E '^golang.org/x/crypto/(ssh|openpgp)(/|$)' "$RUNNER_TEMP/crypto-imports.txt"; then
            echo "Review the crypto version before adding SSH or OpenPGP dependencies"
            exit 1
          fi

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Build the runtime image
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o starcli .
          docker build --platform linux/amd64 -t starcli:test .
      - name: Test the runtime image
        env:
          STARCLI_TEST_IMAGE: starcli:test
        run: go test -v ./e2e -run TestContainer -count=1

  ci:
    permissions:
      contents: read
      id-token: write
    # Reusable CI lives in 1set/meta — the single source of truth for every
    # Star* module's pipeline. Pinned to a commit SHA for supply-chain safety;
    # bump the pin when meta's workflow changes (Dependabot github-actions can
    # automate this).
    uses: 1set/meta/.github/workflows/go-ci.yml@23f088bcd6dce16c93e0056d7b70b4f4434208e8
    with:
      # Match go.mod's compatibility floor; the shared workflow also tests
      # the current stable Go release.
      go-floor: "1.25"
      # Test-coverage ratchet (covcheck). The CLI-R0 characterization suite
      # brought total statement coverage to ~69.5% (cli 68.9 / config 94.1 /
      # util 92.7 / sys 77.8; main.go and web/ are the uncovered remainder).
      # Floor set just below that, with headroom for platform variance; tighten
      # as the M1 refactor and CLI-01 tests raise it. starcli is a CLI
      # application (not a starlark domain module), so the doc-coverage and
      # footprint gates stay off (as on starbox).
      cov-min: 65
    secrets: inherit

  # The examples/ build-your-own demos are their own Go module (minimal deps, out
  # of the main coverage gate), so they build in a separate, non-gating job rather
  # than inside the reusable CI. This just proves the demos and the kit API they
  # use still compile and vet clean.
  examples:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
      - name: Build and vet the examples module
        working-directory: examples
        run: |
          go build ./...
          go vet ./...
